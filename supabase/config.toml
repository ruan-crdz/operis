project_id = "operis"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/", "http://localhost:3000/?auth=callback", "http://localhost:3000/?auth=recovery"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10
[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
[analytics]
enabled = false

[functions.operis]
# The handler verifies the JWT with Auth.getUser; supports modern signing keys.
verify_jwt = false
